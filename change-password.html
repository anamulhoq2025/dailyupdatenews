<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইমেইল ও পাসওয়ার্ড পরিবর্তন - অ্যাডমিন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
    
    <!-- হেডার -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-user-gear text-xl"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-800">অ্যাকাউন্ট তথ্য পরিবর্তন করুন</h2>
      <p class="text-xs text-gray-500 mt-1">আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড আপডেট করুন</p>
    </div>

    <!-- ফর্ম (এখানে onsubmit এ সঠিক ফাংশন নাম দেওয়া হয়েছে) -->
    <form id="change-credentials-form" onsubmit="handleChangeCredentials(event)" class="space-y-4">
      
      <!-- বর্তমান পাসওয়ার্ড (সিকিউরিটির জন্য) -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">বর্তমান পাসওয়ার্ড *</label>
        <input type="password" id="current-pass" required placeholder="বর্তমান পাসওয়ার্ড দিন" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <hr class="my-2 border-gray-200">

      <!-- নতুন ইমেইল -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">নতুন ইমেইল (User Email) *</label>
        <input type="email" id="new-email" required placeholder="উদাহরণ: admin@gmail.com" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <!-- নতুন পাসওয়ার্ড -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">নতুন পাসওয়ার্ড *</label>
        <input type="password" id="new-pass" required placeholder="নতুন পাসওয়ার্ড দিন" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <!-- নিশ্চিতকরণ পাসওয়ার্ড -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">নতুন পাসওয়ার্ড পুনরায় লিখুন *</label>
        <input type="password" id="confirm-pass" required placeholder="পুনরায় নতুন পাসওয়ার্ড দিন" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <!-- বাটন -->
      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">
        তথ্য আপডেট করুন
      </button>

      <a href="admin.html" class="block text-center text-xs font-semibold text-gray-600 hover:text-red-600 mt-3">
        &lark; অ্যাডমিন ড্যাশবোর্ডে ফিরে যান
      </a>

    </form>
  </div>

  <script src="javascript/change-password.js"></script>
</body>
</html>
