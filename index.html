    <!-- JavaScript Engine -->
    <script>
        const sampleNewsDatabase = [
            {
                id: "news-101",
                title: "ডিজিটাল ব্যাংকিং সেবায় আসছে নতুন বৈপ্লবিক পরিবর্তন",
                category: "অর্থনীতি",
                content: "দেশের প্রধান ব্যাংকগুলো এখন কৃত্রিম বুদ্ধিমত্তা চালিত নতুন ডিজিটাল সেবা চালু করতে যাচ্ছে...",
                image: "https://picsum.photos/600/350?random=1",
                publishedAt: new Date(Date.now() - 5 * 60 * 1000).toISOString()
            }
        ];

        function formatTimeAgo(isoString) {
            const publishedDate = new Date(isoString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - publishedDate) / 1000);

            const banglaNumbers = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
            const toBanglaNum = (num) => String(num).replace(/[0-9]/g, digit => banglaNumbers[digit]);

            if (diffInSeconds < 60) return "এখনই";
            const minutes = Math.floor(diffInSeconds / 60);
            if (minutes < 60) return `${toBanglaNum(minutes)} মিনিট আগে`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${toBanglaNum(hours)} ঘণ্টা আগে`;
            const days = Math.floor(hours / 24);
            return `${toBanglaNum(days)} দিন আগে`;
        }

        function renderPortal() {
            let allNews = JSON.parse(localStorage.getItem('portal_news')) || sampleNewsDatabase;
            allNews.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

            const latestListEl = document.getElementById('latest-news-list');
            if (latestListEl) {
                latestListEl.innerHTML = allNews.map((news, index) => `
                    <article class="border-b border-gray-100 pb-3 last:border-0 group cursor-pointer" onclick="openSingleNews('${news.id}')">
                        <div class="flex items-start space-x-3">
                            <span class="text-2xl font-bold text-red-600 opacity-75">${index + 1}</span>
                            <div class="flex-1">
                                <span class="text-[11px] font-semibold text-red-600 uppercase tracking-wider">${news.category || 'সংবাদ'}</span>
                                <h4 class="text-sm font-bold text-gray-800 group-hover:text-red-600 transition-colors line-clamp-2 leading-snug">
                                    ${news.title}
                                </h4>
                                <span class="text-[11px] text-gray-400 mt-1 block">🕒 ${formatTimeAgo(news.publishedAt)}</span>
                            </div>
                        </div>
                    </article>
                `).join('');
            }

            const mainGridEl = document.getElementById('main-news-grid');
            if (mainGridEl) {
                mainGridEl.innerHTML = allNews.map(news => `
                    <div class="bg-white rounded-lg overflow-hidden border border-gray-200 hover:shadow-md transition cursor-pointer flex flex-col justify-between" onclick="openSingleNews('${news.id}')">
                        <img src="${news.image || 'https://picsum.photos/600/350'}" alt="${news.title}" class="w-full h-48 object-cover">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-bold text-red-600">${news.category || 'সাধারণ'}</span>
                                <h3 class="text-lg font-bold text-gray-900 group-hover:text-red-600 transition mt-1 line-clamp-2">
                                    ${news.title}
                                </h3>
                                <p class="text-gray-600 text-sm mt-2 line-clamp-2">${news.content || news.description || ''}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
                                <span>🕒 ${formatTimeAgo(news.publishedAt)}</span>
                                <span class="text-red-600 font-semibold hover:underline">বিস্তারিত পড়ুন &rarr;</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 🔥 মূল সমাধান: single-news.html এর বদলে সঠিক 'article.html' ফাইলে রিডাইরেক্ট করা হলো
        function openSingleNews(newsId) {
            window.location.href = `article.html?id=${newsId}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPortal();
            setInterval(renderPortal, 60000); 
        });
    </script>
