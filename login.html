<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন - দৈনিক আপডেট নিউজ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 w-full max-w-md mx-4">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-red-600"><i class="fa-solid fa-lock"></i> অ্যাডমিন লগইন</h2>
            <p class="text-xs text-gray-500 mt-1">দনিক আপডেট নিউজ পোর্টাল প্যানেল</p>
        </div>

        <!-- লগইন ফর্ম -->
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label for="admin-user" class="block text-sm font-bold text-gray-700 mb-1">ইউজারনেম বা ইমেইল</label>
                <input type="text" id="admin-user" required placeholder="ইউজারনেম দিন (যেমন: admin)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div>
                <label for="admin-pass" class="block text-sm font-bold text-gray-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="admin-pass" required placeholder="পাসওয়ার্ড দিন (যেমন: admin123)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition text-sm uppercase shadow">
                লগইন করুন
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-gray-500 hover:text-red-600"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরে যান</a>
        </div>
    </div>

    <!-- আলাদা login.js ফাইল কানেক্ট করা -->
    <script src="javascript/login.js"></script>
    <script src="javascript/admin.js"></script>

</body>
</html>
