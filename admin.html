<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নিউজ পোর্টাল - অ্যাডমিন ড্যাশবোর্ড</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Font Support -->
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tiro Bangla', serif, sans-serif; }
  </style>

  <script>
    // পেজ লোড হওয়ার শুরুতেই চেক করবে সে লগইন করা কি না
    const isLoggedIn = localStorage.getItem('isAdminLoggedIn');

    if (isLoggedIn !== 'true') {
      alert("অ্যাডমিন প্যানেলে প্রবেশ করতে হলে আপনাকে প্রথমে লগইন করতে হবে!");
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-900 overflow-x-hidden">

  <!-- Header with Responsive Flex Layout -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
      
      <!-- Brand Logo & Title -->
      <div class="flex items-center gap-2.5 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-2">
          <span class="bg-red-600 text-white px-2 py-1 rounded-lg text-xs font-bold">Admin</span>
          <h1 class="text-base sm:text-xl font-bold text-gray-900">নিউজ পোর্টাল অ্যাডমিন প্যানেল</h1>
        </div>
      </div>
      
      <!-- Responsive Navigation Buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2 w-full md:w-auto justify-end overflow-x-auto pb-1 md:pb-0 text-xs sm:text-sm">
        <a href="change-password.html" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-2.5 sm:px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0">
          <i class="fa-solid fa-key text-red-600"></i> পাসওয়ার্ড
        </a>
        <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-2.5 sm:px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0">
          <i class="fa-solid fa-house text-red-600"></i> হোম
        </a>
        <button onclick="handleLogout()" class="bg-gray-800 hover:bg-black text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0">
          <i class="fa-solid fa-right-from-bracket"></i> লগআউট
        </button>
        <a href="index.html" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-2.5 sm:px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 whitespace-nowrap shrink-0">
          <i class="fa-solid fa-globe"></i> লাইভ সাইট
        </a>
      </div>

    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">
    
    <!-- Left Column: New Post Form (7 Columns) -->
    <section class="lg:col-span-7 bg-white p-4 sm:p-8 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-base sm:text-xl font-bold text-red-600 border-b pb-3 mb-5 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square"></i> নতুন সংবাদ, ছবি বা ভিডিও প্রকাশ করুন
      </h2>

      <form id="news-form" onsubmit="handlePublishNews(event)" class="space-y-4 sm:space-y-5">
        
        <!-- ১. ক্যাটাগরি সিলেক্ট ড্রপডাউন -->
        <div>
          <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">ক্যাটাগরি নির্বাচন করুন *</label>
          <select id="news-category" required onchange="toggleJobFields()" class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 bg-white">
            <option value="" disabled selected>-- ক্যাটাগরি বেছে নিন --</option>
            <option value="politics">রাজনীতি (Politics)</option>
            <option value="bangladesh">বাংলাদেশ (Bangladesh)</option>
            <option value="crime">অপরাধ (Crime)</option>
            <option value="world">বিশ্ব (World)</option>
            <option value="busin">বাণিজ্য (Business/Trade)</option>
            <option value="sports">খেলাধুলা (Sports)</option>
            <option value="entertainment">বিনোদন (Entertainment)</option>
            <option value="job">চাকরি (Job Circular)</option>
          </select>
        </div>

        <!-- চাকরি সংক্রান্ত অতিরিক্ত ফিল্ড (যা শুধু 'চাকরি' সিলেক্ট করলেই দেখাবে) -->
        <div id="job-extra-fields" class="hidden space-y-3 sm:space-y-4 p-3 sm:p-4 bg-red-50 rounded-lg border border-red-200">
          <h3 class="text-xs sm:text-sm font-bold text-red-600 flex items-center gap-1.5">
            <i class="fa-solid fa-briefcase"></i> চাকরির অতিরিক্ত তথ্য
          </h3>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div>
              <label class="block text-[11px] sm:text-xs font-bold text-gray-700 mb-1">চাকরির ধরন *</label>
              <select id="job-type" class="w-full px-3 py-2 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
                <option value="সরকারি চাকরি">সরকারি চাকরি</option>
                <option value="বেসরকারি চাকরি">বেসরকারি চাকরি</option>
                <option value="অন্যান্য">অন্যান্য</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] sm:text-xs font-bold text-gray-700 mb-1">পদসংখ্যা *</label>
              <input type="text" id="job-vacancies" placeholder="যেমন: ৩৯৩ জন / অনির্দিষ্ট" class="w-full px-3 py-2 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
            </div>
          </div>

          <div>
            <label class="block text-[11px] sm:text-xs font-bold text-gray-700 mb-1">আবেদনের শেষ তারিখ *</label>
            <input type="date" id="job-deadline" class="w-full px-3 py-2 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
          </div>
        </div>

        <!-- ২. সংবাদ শিরোনাম -->
        <div>
          <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">সংবাদের শিরোনাম (Headline) *</label>
          <input type="text" id="news-title" required placeholder="এখানে শিরোনাম লিখুন..." class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <!-- ৩. প্রতিষ্ঠান বা অর্গানাইজেশন -->
        <div>
          <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">প্রতিষ্ঠান / অর্গানাইজেশন (ঐচ্ছিক)</label>
          <input type="text" id="news-org" placeholder="যেমন: বাংলাদেশ ব্যাংক / চট্টগ্রাম বন্দর কর্তৃপক্ষ" class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <!-- ৪. ছবি/ফটো অপশন -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-gray-50 p-3 sm:p-4 rounded-lg border border-gray-200">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">ছবির অনলাইন লিংক</label>
            <input type="url" id="news-image-url" placeholder="https://..." class="w-full px-2.5 py-1.5 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">অথবা পিসি থেকে ছবি দিন</label>
            <input type="file" id="news-image-file" accept="image/*" class="w-full text-[11px] sm:text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-[11px] file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
          </div>
        </div>

        <!-- ৫. ভিডিও অপশন -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-gray-50 p-3 sm:p-4 rounded-lg border border-gray-200">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">🎥 ভিডিও লিংক (YouTube URL)</label>
            <input type="url" id="news-video-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-2.5 py-1.5 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">📁 অথবা পিসি থেকে ভিডিও ফাইল</label>
            <input type="file" id="news-video-file" accept="video/*" class="w-full text-[11px] sm:text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-[11px] file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
          </div>
        </div>

        <!-- ৬. আবেদনের লিঙ্ক -->
        <div>
          <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">অফিশিয়াল আবেদনের লিংক (প্রযোজ্য ক্ষেত্রে)</label>
          <input type="url" id="news-apply-link" placeholder="https://example.com/apply" class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500">
        </div>

        <!-- ৭. বিস্তারিত বিবরণ -->
        <div>
          <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">বিস্তারিত বিবরণ (Description) *</label>
          <textarea id="news-desc" required rows="4" placeholder="সংবাদের বিস্তারিত বিবরণ এখানে লিখুন..." class="w-full px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
        </div>

        <!-- সাবমিট বাটন -->
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 sm:py-3 px-4 sm:px-6 text-sm sm:text-base rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> সফলভাবে পাবলিশ করুন
        </button>

      </form>
    </section>

    <!-- Right Column: Published News Dropdown & Management (5 Columns) -->
    <section class="lg:col-span-5 space-y-6">
      
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-gray-200">
        <h3 class="text-base sm:text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> প্রকাশিত নিউজ ড্রপডাউন ও তালিকা
        </h3>

        <!-- ক্যাটাগরি ফিল্টার ড্রপডাউন -->
        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-600 mb-1">ক্যাটাগরি অনুযায়ী দেখুন:</label>
          <select id="filter-category" onchange="renderAdminNewsList()" class="w-full px-3 py-2 text-xs sm:text-sm rounded-lg border border-gray-300 bg-white">
            <option value="all">সব ক্যাটাগরি (All Published)</option>
            <option value="politics">রাজনীতি</option>
            <option value="bangladesh">বাংলাদেশ</option>
            <option value="crime">অপরাধ</option>
            <option value="world">বিশ্ব</option>
            <option value="trade">বাণিজ্য</option>
            <option value="sports">খেলাধুলা</option>
            <option value="entertainment">বিনোদন</option>
            <option value="job">চাকরি</option>
          </select>
        </div>

        <!-- পাবলিশ করা নিউজের লিস্ট কন্টেইনার -->
        <div id="admin-published-list" class="space-y-3 max-h-[350px] sm:max-h-[450px] overflow-y-auto pr-1">
          <!-- JS dynamic list -->
        </div>
      </div>

    </section>

  </main>

  <!-- JavaScript for Toggle Job Fields -->
  <script>
    function toggleJobFields() {
      const category = document.getElementById('news-category').value;
      const jobFields = document.getElementById('job-extra-fields');
      if (category === 'job') {
        jobFields.classList.remove('hidden');
      } else {
        jobFields.classList.add('hidden');
      }
    }
  </script>

  <!-- Script Links -->
  <script src="javascript/admin.js"></script>
  <script src="javascript/login.js"></script>
  <script src="javascript/header.js"></script>
  <script src="javascript/autonewsupdate.js"></script>
  <script src="javascript/politics.js"></script>
  <script src="javascript/bangladesh.js"></script>
  <script src="javascript/crime.js"></script>
  <script src="javascript/world.js"></script>
  <script src="javascript/business.js"></script>
  <script src="javascript/sports.js"></script>
  <script src="javascript/entertainment.js"></script>
  <script src="javascript/job.js"></script>
  <script src="javascript/change-password.js"></script>

</body>
</html>
